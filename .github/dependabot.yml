version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "com.android.application"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gradle"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gradle-wrapper"
        update-types:
          - "version-update:semver-major"
      # These releases require compileSdk 37, beyond the AGP 8 / API 36 line
      # (androidx.core 1.19, okhttp-android 5.5). Patch updates are still allowed.
      - dependency-name: "androidx.core:core-ktx"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "com.squareup.okhttp3:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
