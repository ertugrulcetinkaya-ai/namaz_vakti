name: Diyanet mirror prune

on:
  schedule:
    - cron: "23 1 2 2 *"
  workflow_dispatch:

concurrency:
  group: diyanet-data-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diyanet-data
          path: mirror
          fetch-depth: 0
      - name: Prune the previous calendar year
        working-directory: mirror
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import re
          import shutil
          import sys
          from pathlib import Path

          v1 = Path("v1")
          manifest_path = v1 / "manifest.json"
          expected_districts = 869
          minimum_current_year_districts = (expected_districts * 98 + 99) // 100
          current_year = datetime.now(timezone.utc).year
          previous_year = current_year - 1

          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("schema") != 1 or manifest.get("source") != "namazvakti.mtopal.dev":
                  raise ValueError("unsupported manifest schema or source")
              files = manifest.get("files")
              if not isinstance(files, dict):
                  raise ValueError("manifest files must be an object")

              entry_years = {}
              for district_id, entry in files.items():
                  if not isinstance(district_id, str) or not re.fullmatch(r"[0-9]+", district_id):
                      raise ValueError(f"invalid district ID in manifest: {district_id!r}")
                  if not isinstance(entry, dict):
                      raise ValueError(f"invalid manifest entry for district {district_id}")
                  path = entry.get("path")
                  match = re.fullmatch(r"([0-9]{4})/([0-9]+)\.json", path or "")
                  if not match or match.group(2) != district_id:
                      raise ValueError(f"invalid manifest path for district {district_id}")
                  entry_years[district_id] = int(match.group(1))

              current_year_count = sum(year == current_year for year in entry_years.values())
              if current_year_count < minimum_current_year_districts:
                  print(
                      "::warning::Diyanet mirror prune skipped: "
                      f"current year has {current_year_count}/{expected_districts} districts; "
                      f"at least {minimum_current_year_districts} are required."
                  )
                  sys.exit(1)

              previous_year_entries = {
                  district_id for district_id, year in entry_years.items() if year == previous_year
              }
              previous_year_dir = v1 / str(previous_year)
              if previous_year_dir.is_symlink():
                  raise ValueError("previous-year directory must not be a symlink")
              directory_exists = previous_year_dir.is_dir()
              if directory_exists:
                  shutil.rmtree(previous_year_dir)
              for district_id in previous_year_entries:
                  del files[district_id]

              if directory_exists or previous_year_entries:
                  manifest["generatedAt"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace(
                      "+00:00", "Z"
                  )
                  temporary_manifest = manifest_path.with_suffix(".json.tmp")
                  temporary_manifest.write_text(
                      json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
                  temporary_manifest.replace(manifest_path)
              print(
                  f"Pruned {len(previous_year_entries)} manifest entries and "
                  f"{previous_year_dir if directory_exists else 'no previous-year directory'}; "
                  f"current-year coverage is {current_year_count}/{expected_districts}."
              )
          except Exception as error:
              print(f"::error::Diyanet mirror prune failed: {error}")
              raise
          PY
      - name: Commit cleanup to the data branch
        run: |
          set -euo pipefail
          if git -C mirror diff --quiet -- v1; then
            echo "No previous-year files needed pruning."
            exit 0
          fi
          git -C mirror add -- v1
          git -C mirror config user.name "github-actions[bot]"
          git -C mirror config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C mirror commit -m "Prune previous-year Diyanet mirror"
          git -C mirror push origin HEAD:diyanet-data
