name: Beta Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Beta version name
        required: true
        default: 0.1.0-beta.1
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every Beta Release run gets a unique, monotonically increasing code above
  # this baseline. 200 keeps CI builds above the hand-built betas (101-199),
  # so a published APK always installs as an update.
  VERSION_CODE_BASE: "200"
  # SHA-256 of the permanent release certificate (lowercase, no colons).
  EXPECTED_CERT_SHA256: "3fc5bb3f098de85e54777b5d07aaed2fc4414f0c5b26f773914e3059305b5e88"

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Normalize tag version name
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Derive monotonically increasing version code
        run: echo "VERSION_CODE=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Verify and build unsigned verification artifacts
        run: ./gradlew --dependency-verification=strict lint test assembleDebug assembleMinified assembleMinifiedAndroidTest assembleRelease

      - name: Upload verification artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: namaz-vakti-${{ env.VERSION_NAME }}-verification
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/minified/*.apk
            app/build/outputs/apk/androidTest/minified/*.apk

  instrumented:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Normalize tag version name
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Derive monotonically increasing version code
        run: echo "VERSION_CODE=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Enable KVM for the managed device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run managed-device instrumented tests
        run: ./gradlew --dependency-verification=strict pixel2api35MinifiedAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload instrumented test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: namaz-vakti-${{ env.VERSION_NAME }}-instrumented-reports
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**

  release:
    needs: [verify, instrumented]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Normalize tag version name
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Derive monotonically increasing version code
        run: echo "VERSION_CODE=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required release signing secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --dependency-verification=strict assembleRelease bundleRelease

      - name: Verify release signatures
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          bundle_path="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$apk_path"
          test -n "$bundle_path"
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_home"
          apksigner_path="$(find "$android_home/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk_path"
          bundle_verification="$(jarsigner -verify -verbose -certs "$bundle_path" 2>&1)"
          printf '%s\n' "$bundle_verification"
          # A here-string, not `printf | grep -q`: with pipefail, grep -q exits on the first match and the
          # long jarsigner output makes printf fail with SIGPIPE, failing a correctly signed bundle.
          grep -Fq 'jar verified' <<<"$bundle_verification"
          cert_digest="$("$apksigner_path" verify --print-certs "$apk_path" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          echo "Release certificate SHA-256: $cert_digest"
          if [ "$cert_digest" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the permanent release key"
            exit 1
          fi
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: namaz-vakti-${{ env.VERSION_NAME }}-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          versioned="NamazVakti-${VERSION_NAME}.apk"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK_PATH" "$RUNNER_TEMP/release-assets/$versioned"
          # Stable name for https://github.com/<repo>/releases/latest/download/NamazVakti.apk
          cp "$APK_PATH" "$RUNNER_TEMP/release-assets/NamazVakti.apk"
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Namaz Vakti ${VERSION_NAME} (sürüm kodu ${VERSION_CODE}).

          **Kurulum:** Telefonda \`${versioned}\` dosyasını indirip açın; istenirse "bilinmeyen kaynaklardan yükleme" izni verin. Önceki sürümlerin üzerine güncelleme olarak kurulur.

          İmza sertifikası SHA-256: \`${EXPECTED_CERT_SHA256}\`

          Değişiklikler için [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md).
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/release-assets/*.apk --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/release-assets/*.apk \
              --target "$GITHUB_SHA" \
              --title "Namaz Vakti ${VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/NamazVakti.apk"
