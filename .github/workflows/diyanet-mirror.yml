          PREVIOUS_FINISHED_AT: ${{ (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',6,') && needs.chunk_6.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',5,') && needs.chunk_5.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',4,') && needs.chunk_4.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',3,') && needs.chunk_3.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') && needs.chunk_2.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') && needs.chunk_1.outputs.finished_at) || '' }}
