          CHUNK_INDEX: "9"
          PREVIOUS_FINISHED_AT: ${{ (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',8,') && needs.chunk_8.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',7,') && needs.chunk_7.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',6,') && needs.chunk_6.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',5,') && needs.chunk_5.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',4,') && needs.chunk_4.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',3,') && needs.chunk_3.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') && needs.chunk_2.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') && needs.chunk_1.outputs.finished_at) || '' }}
        run: |
          if [ -n "$PREVIOUS_FINISHED_AT" ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --previous-completion "$PREVIOUS_FINISHED_AT"
          elif [ "$CHUNK_INDEX" -gt 1 ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --from-now
          fi
      - name: Fetch chunk 9
        run: python3 tools/diyanet_mirror/build_mirror.py --chunk 9 --output "$RUNNER_TEMP/diyanet-chunk-9"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diyanet-chunk-9
          path: ${{ runner.temp }}/diyanet-chunk-9/
          if-no-files-found: error
          retention-days: 7
      - id: finished
        name: Record job completion time
        run: echo "finished_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  publish:
    needs: [validate, chunk_1, chunk_2, chunk_3, chunk_4, chunk_5, chunk_6, chunk_7, chunk_8, chunk_9]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm selected chunks completed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_CHUNKS: ${{ needs.validate.outputs.selected_chunks }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          selected = [int(value) for value in os.environ["SELECTED_CHUNKS"].split(",")]
          failed = [
              f"chunk_{index} ({needs.get(f'chunk_{index}', {}).get('result')})"
              for index in selected
              if needs.get(f"chunk_{index}", {}).get("result") != "success"
          ]
          if failed:
              raise SystemExit("Selected chunks did not complete successfully: " + ", ".join(failed))
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diyanet-chunk-*
          path: ${{ runner.temp }}/diyanet-current-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') }}
        with:
          name: diyanet-chunk-1
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') }}
        with:
          name: diyanet-chunk-2
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',3,') }}
        with:
          name: diyanet-chunk-3
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',4,') }}
        with:
          name: diyanet-chunk-4
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',5,') }}
        with:
          name: diyanet-chunk-5
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',6,') }}
        with:
          name: diyanet-chunk-6
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',7,') }}
        with:
          name: diyanet-chunk-7
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',8,') }}
        with:
          name: diyanet-chunk-8
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          ${{ needs.validate.outputs.reuse_run_id != '' &&
              !contains(format(',{0},', needs.validate.outputs.selected_chunks), ',9,') }}
        with:
          name: diyanet-chunk-9
          run-id: ${{ needs.validate.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/diyanet-reuse-artifacts/diyanet-chunk-9
      - name: Read the current orphan data branch
        id: current_branch
        run: |
          if git ls-remote --heads origin diyanet-data > "$RUNNER_TEMP/diyanet-branch-ref"; then
            if [ -s "$RUNNER_TEMP/diyanet-branch-ref" ]; then
              git fetch origin refs/heads/diyanet-data:refs/remotes/origin/diyanet-data
              mkdir -p "$RUNNER_TEMP/diyanet-existing"
              git archive origin/diyanet-data v1 | tar -x -C "$RUNNER_TEMP/diyanet-existing"
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            exit 1
          fi
      - name: Build or update the publication
        env:
          SELECTED_CHUNKS: ${{ needs.validate.outputs.selected_chunks }}
          REUSE_RUN_ID: ${{ needs.validate.outputs.reuse_run_id }}
          BRANCH_EXISTS: ${{ steps.current_branch.outputs.exists }}
        run: |
          set -euo pipefail
          PUBLISH_ROOT="$RUNNER_TEMP/diyanet-publication"
          CURRENT_ROOT="$RUNNER_TEMP/diyanet-current-artifacts"
          REUSE_ROOT="$RUNNER_TEMP/diyanet-reuse-artifacts"
          ALL_CHUNKS="1,2,3,4,5,6,7,8,9"

          if [ -n "$REUSE_RUN_ID" ] || [ "$SELECTED_CHUNKS" = "$ALL_CHUNKS" ] || [ "$BRANCH_EXISTS" != "true" ]; then
            CHUNK_DIRS=()
            for CHUNK_INDEX in 1 2 3 4 5 6 7 8 9; do
              if [[ ",$SELECTED_CHUNKS," == *",$CHUNK_INDEX,"* ]]; then
                CHUNK_DIR="$CURRENT_ROOT/diyanet-chunk-$CHUNK_INDEX"
              elif [ -n "$REUSE_RUN_ID" ]; then
                CHUNK_DIR="$REUSE_ROOT/diyanet-chunk-$CHUNK_INDEX"
              else
                CHUNK_DIR="$RUNNER_TEMP/diyanet-missing-chunks/diyanet-chunk-$CHUNK_INDEX"
              fi
              CHUNK_DIRS+=("$CHUNK_DIR")
            done
            MERGE_ARGS=(--merge-chunks "${CHUNK_DIRS[@]}")
            if [ -z "$REUSE_RUN_ID" ] && [ "$SELECTED_CHUNKS" != "$ALL_CHUNKS" ]; then
              MERGE_ARGS+=(--allow-missing-chunks)
            fi
            MERGE_ARGS+=(--output "$PUBLISH_ROOT")
            python3 tools/diyanet_mirror/build_mirror.py "${MERGE_ARGS[@]}"

            if [ "$BRANCH_EXISTS" = "true" ]; then
              PREVIOUS_YEAR="$(date -u -d '1 year ago' +%Y)"
              if [ -d "$RUNNER_TEMP/diyanet-existing/v1/$PREVIOUS_YEAR" ]; then
                cp -R "$RUNNER_TEMP/diyanet-existing/v1/$PREVIOUS_YEAR" "$PUBLISH_ROOT/v1/"
              fi
            fi
          else
            FIRST_UPDATE=true
            IFS=',' read -r -a CHUNK_INDICES <<< "$SELECTED_CHUNKS"
            for CHUNK_INDEX in "${CHUNK_INDICES[@]}"; do
              if [ "$FIRST_UPDATE" = true ]; then
                EXISTING_V1="$RUNNER_TEMP/diyanet-existing/v1"
                FIRST_UPDATE=false
              else
                EXISTING_V1="$PUBLISH_ROOT/v1"
              fi
              python3 tools/diyanet_mirror/build_mirror.py \
                --update-chunk "$CURRENT_ROOT/diyanet-chunk-$CHUNK_INDEX" \
                --chunk-index "$CHUNK_INDEX" \
                --existing-v1 "$EXISTING_V1" \
                --output "$PUBLISH_ROOT"
            done
          fi
      - name: Publish only v1 to the orphan data branch
        env:
          BRANCH_EXISTS: ${{ steps.current_branch.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$BRANCH_EXISTS" = "true" ]; then
            git checkout -B diyanet-data origin/diyanet-data
          else
            git switch --orphan diyanet-data
          fi
          git ls-files -z | xargs -0 -r git rm -rf --quiet
          git clean -fdx
          mkdir -p v1
          cp -R "$RUNNER_TEMP/diyanet-publication/v1/." v1/
          git add -- v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Diyanet mirror"
          git push origin HEAD:diyanet-data
