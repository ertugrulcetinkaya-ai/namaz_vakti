name: Diyanet mirror

on:
  schedule:
    - cron: "17 0 2 1 *"
  workflow_dispatch:
    inputs:
      only_chunk:
        description: Run all chunks, or a comma-separated list such as 1,2,3
        required: false
        type: string
        default: all
      reuse_run_id:
        description: Optional run ID for artifacts of chunks not selected
        required: false
        type: string

concurrency:
  group: diyanet-data-publication
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      selected_chunks: ${{ steps.selection.outputs.selected_chunks }}
      reuse_run_id: ${{ steps.selection.outputs.reuse_run_id }}
    steps:
      - id: selection
        name: Validate chunk selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          ONLY_CHUNK: ${{ inputs.only_chunk }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          python3 - <<'PY'
          import os
          import re

          value = os.environ.get("ONLY_CHUNK", "") or "all"
          if value == "all":
              selected = list(range(1, 10))
          elif re.fullmatch(r"[1-9](?:,[1-9])*", value):
              values = [int(chunk) for chunk in value.split(",")]
              if len(values) != len(set(values)):
                  raise SystemExit("only_chunk must not contain duplicate chunk numbers")
              selected = sorted(values)
          else:
              raise SystemExit("only_chunk must be 'all' or a comma-separated list of numbers 1 through 9")

          reuse_run_id = os.environ.get("REUSE_RUN_ID", "")
          if reuse_run_id and not re.fullmatch(r"[1-9][0-9]*", reuse_run_id):
              raise SystemExit("reuse_run_id must be a positive workflow run ID")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"selected_chunks={','.join(map(str, selected))}\n")
              output.write(f"reuse_run_id={reuse_run_id}\n")
          PY

  chunk_1:
    needs: [validate]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      finished_at: ${{ steps.finished.outputs.finished_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the previous selected chunk's rate-limit window
        env:
          CHUNK_INDEX: "1"
          PREVIOUS_FINISHED_AT: ${{ '' }}
        run: |
          if [ -n "$PREVIOUS_FINISHED_AT" ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --previous-completion "$PREVIOUS_FINISHED_AT"
          elif [ "$CHUNK_INDEX" -gt 1 ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --from-now
          fi
      - name: Fetch chunk 1
        run: python3 tools/diyanet_mirror/build_mirror.py --chunk 1 --output "$RUNNER_TEMP/diyanet-chunk-1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diyanet-chunk-1
          path: ${{ runner.temp }}/diyanet-chunk-1/
          if-no-files-found: error
          retention-days: 7
      - id: finished
        name: Record job completion time
        run: echo "finished_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  chunk_2:
    needs: [validate, chunk_1]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,')
          && (!contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') || needs.chunk_1.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      finished_at: ${{ steps.finished.outputs.finished_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the previous selected chunk's rate-limit window
        env:
          CHUNK_INDEX: "2"
          PREVIOUS_FINISHED_AT: ${{ (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') && needs.chunk_1.outputs.finished_at) || '' }}
        run: |
          if [ -n "$PREVIOUS_FINISHED_AT" ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --previous-completion "$PREVIOUS_FINISHED_AT"
          elif [ "$CHUNK_INDEX" -gt 1 ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --from-now
          fi
      - name: Fetch chunk 2
        run: python3 tools/diyanet_mirror/build_mirror.py --chunk 2 --output "$RUNNER_TEMP/diyanet-chunk-2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diyanet-chunk-2
          path: ${{ runner.temp }}/diyanet-chunk-2/
          if-no-files-found: error
          retention-days: 7
      - id: finished
        name: Record job completion time
        run: echo "finished_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  chunk_3:
    needs: [validate, chunk_1, chunk_2]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          contains(format(',{0},', needs.validate.outputs.selected_chunks), ',3,')
          && (!contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') || needs.chunk_1.result == 'success')
          && (!contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') || needs.chunk_2.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      finished_at: ${{ steps.finished.outputs.finished_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the previous selected chunk's rate-limit window
        env:
          CHUNK_INDEX: "3"
          PREVIOUS_FINISHED_AT: ${{ (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') && needs.chunk_2.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') && needs.chunk_1.outputs.finished_at) || '' }}
        run: |
          if [ -n "$PREVIOUS_FINISHED_AT" ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --previous-completion "$PREVIOUS_FINISHED_AT"
          elif [ "$CHUNK_INDEX" -gt 1 ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --from-now
          fi
      - name: Fetch chunk 3
        run: python3 tools/diyanet_mirror/build_mirror.py --chunk 3 --output "$RUNNER_TEMP/diyanet-chunk-3"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diyanet-chunk-3
          path: ${{ runner.temp }}/diyanet-chunk-3/
          if-no-files-found: error
          retention-days: 7
      - id: finished
        name: Record job completion time
        run: echo "finished_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  chunk_4:
    needs: [validate, chunk_1, chunk_2, chunk_3]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          contains(format(',{0},', needs.validate.outputs.selected_chunks), ',4,')
          && (!contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') || needs.chunk_1.result == 'success')
          && (!contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') || needs.chunk_2.result == 'success')
          && (!contains(format(',{0},', needs.validate.outputs.selected_chunks), ',3,') || needs.chunk_3.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      finished_at: ${{ steps.finished.outputs.finished_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the previous selected chunk's rate-limit window
        env:
