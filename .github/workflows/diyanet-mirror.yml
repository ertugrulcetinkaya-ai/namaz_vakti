          PREVIOUS_FINISHED_AT: ${{ (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',3,') && needs.chunk_3.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',2,') && needs.chunk_2.outputs.finished_at) || (contains(format(',{0},', needs.validate.outputs.selected_chunks), ',1,') && needs.chunk_1.outputs.finished_at) || '' }}
        run: |
          if [ -n "$PREVIOUS_FINISHED_AT" ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --previous-completion "$PREVIOUS_FINISHED_AT"
          elif [ "$CHUNK_INDEX" -gt 1 ]; then
            python3 tools/diyanet_mirror/wait_for_rate_window.py --minutes 65 --from-now
          fi
      - name: Fetch chunk 4
        run: python3 tools/diyanet_mirror/build_mirror.py --chunk 4 --output "$RUNNER_TEMP/diyanet-chunk-4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
